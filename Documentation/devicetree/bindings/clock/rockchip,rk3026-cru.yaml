%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/rockchip,rk3026-cru.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Rockchip RK3026 Clock and Reset Unit (CRU)

maintainers:
  - Heiko Stuebner <heiko@sntech.de>

description: |
  The RK3026 clock controller generates and supplies clocks to the controllers
  within the SoC and also implements a reset controller for SoC peripherals.
  Each clock is assigned an identifier and client nodes can use this identifier
  to specify the clock which they consume. All available clocks are defined as
  preprocessor macros in the dt-bindings/clock/rk3026-cru.h header and can be
  used in device tree sources. Similar macros exist for the reset sources in
  the same file.
  The only clock generated outside the SoC that the CRU is fed from is the
  24 MHz crystal:
    - "xin24m" - crystal input - required

properties:
  compatible:
    const: rockchip,rk3026-cru

  reg:
    maxItems: 1

  "#clock-cells":
    const: 1

  "#reset-cells":
    const: 1

  clocks:
    maxItems: 1

  clock-names:
    const: xin24m

  rockchip,grf:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the syscon managing the "general register files" (GRF),
      if missing pll rates are not changeable, due to the missing pll
      lock status.

required:
  - compatible
  - reg
  - "#clock-cells"
  - "#reset-cells"
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/rk3026-cru.h>

    cru: clock-controller@20000000 {
      compatible = "rockchip,rk3026-cru";
      reg = <0x20000000 0x1000>;
      clocks = <&xin24m>;
      clock-names = "xin24m";
      rockchip,grf = <&grf>;
      #clock-cells = <1>;
      #reset-cells = <1>;
      assigned-clocks = <&cru PLL_GPLL>;
      assigned-clock-rates = <768000000>;
    };
