%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/rockchip,rk3026-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Rockchip RK3026 I2C controller

description: |
  The RK3026 has four I2C controllers of the RK3xxx design. Unlike the other
  SoCs of that family the controllers are not wired to a dedicated block: the
  pads and the controller are shared with a legacy DesignWare I2C, and the GRF
  register GRF_SOC_CON1 bit (11 + bus number) selects which of the two drives
  them. The bit resets to the DesignWare block and no bootloader stage sets it,
  so a controller without the GRF handle below never transfers a byte.

maintainers:
  - Heiko Stuebner <heiko@sntech.de>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: rockchip,rk3026-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: i2c

  rockchip,grf:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the syscon node for the general register file (GRF). The
      driver sets the mode-select bit for the bus in it before the first
      transfer, so it is required.

  clock-frequency:
    default: 100000
    description:
      SCL frequency to use (in Hz). If omitted, 100kHz is used.

  i2c-scl-rising-time-ns:
    default: 1000
    description:
      Number of nanoseconds the SCL signal takes to rise
      (t(r) in I2C specification). If not specified this is assumed to be
      the maximum the specification allows (1000 ns for Standard-mode,
      300 ns for Fast-mode) which might cause slightly slower communication.

  i2c-scl-falling-time-ns:
    default: 300
    description:
      Number of nanoseconds the SCL signal takes to fall
      (t(f) in the I2C specification). If not specified this is assumed to
      be the maximum the specification allows (300 ns) which might cause
      slightly slower communication.

  i2c-sda-falling-time-ns:
    default: 300
    description:
      Number of nanoseconds the SDA signal takes to fall
      (t(f) in the I2C specification). If not specified we will use the SCL
      value since they are the same in nearly all cases.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - rockchip,grf

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/rk3026-cru.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c0: i2c@20072000 {
      compatible = "rockchip,rk3026-i2c";
      reg = <0x20072000 0x1000>;
      interrupts = <GIC_SPI 24 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&cru PCLK_I2C0>;
      clock-names = "i2c";
      rockchip,grf = <&grf>;
      #address-cells = <1>;
      #size-cells = <0>;
    };
