%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/rockchip,rk3026-codec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Rockchip RK3026 internal audio codec

maintainers:
  - Heiko Stuebner <heiko@sntech.de>

description:
  The RK3026 has an on-die stereo audio codec with a headphone amplifier and
  a mixer, driven over the SoC-internal I2S bus. It is a different block from
  the RK3036/RK3308 "acodec", so it has a compatible and a binding of its own.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: rockchip,rk3026-codec

  reg:
    maxItems: 1

  clocks:
    items:
      - description: clock for the codec, the I2S master clock

  clock-names:
    items:
      - const: mclk

  "#sound-dai-cells":
    const: 0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - "#sound-dai-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/rk3026-cru.h>
    codec: codec@20030000 {
      compatible = "rockchip,rk3026-codec";
      reg = <0x20030000 0x4000>;
      clocks = <&cru SCLK_I2S>;
      clock-names = "mclk";
      #sound-dai-cells = <0>;
    };
